<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MintAlpha</title>
<meta name="description" content="Free mint radar: tracked NFT mints, launch reminders and quick Minted / Missed / Dismiss controls.">
<meta name="theme-color" content="#2f4fd6">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="splash" id="splash" role="status" aria-live="polite" aria-label="Loading MintAlpha">
  <div class="stage"><span class="ring"></span><span class="ring r2"></span><span id="splashmark" style="display:block;width:100%;height:100%"></span></div>
  <div class="word">Mint<span class="a">Alpha</span></div>
  <div class="tag">Free mint radar</div>
  <div class="load"><div class="track"><div class="fill" id="splashfill"></div></div><div class="step" id="splashstep">Starting radar</div></div>
  <div class="foot" id="splashfoot">Tap to skip</div>
</div>

<div class="app">
  <header class="bar">
    <span class="hdrmark" id="hdrmark" aria-hidden="true"></span>
    <div class="brand"><b>Mint<span class="a">Alpha</span></b><span id="clockline" class="mono">Free mint radar</span></div>
    <button class="iconbtn" id="refresh" aria-label="Refresh" hidden>
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button class="iconbtn" id="bell" aria-label="Alerts">
      <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span class="badge" id="unread" hidden>0</span>
    </button>
  </header>
  <div id="banner"></div>
  <main id="main"></main>
</div>

<button class="fab" id="fab" aria-label="Simulate a new X post">
  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Simulate post
</button>

<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div id="overlay"></div>
<div id="toastwrap"></div>

<script src="demo.js"></script>
<script src="app.js"></script>
</body>
</html>

services:
  radar:
    build: .
    container_name: freemint-radar
    restart: unless-stopped
    env_file: .env
    environment:
      DASHBOARD_HOST: 0.0.0.0        # listen inside the container...
    ports:
      - "127.0.0.1:8080:8080"        # ...but only expose on the host's localhost
    volumes:
      - ./data:/app/data             # database + backups survive rebuilds
      - ./config.yaml:/app/config.yaml:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
